<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>
    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/218d7c0b86.js" crossorigin="anonymous"></script>
    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100">
    <header class="w-[80%] mx-auto">
        <h1 class="text-4xl font-bold text-[#002C5C] my-5">Job Application Tracker</h1>
    
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-white shadow-md p-5 text-center rounded-md">
                <p class="font-semibold">Total</p>
                <p id="total" class="text-3xl font-semibold text-[#002C5C]">0</p>
            </div>
    
            <div class="bg-white shadow-md p-5 text-center rounded-md">
                <p class="font-semibold">Interview</p>
                <p id="interviewCount" class="text-3xl font-semibold text-green-500">0</p>
            </div>
    
            <div class="bg-white shadow-md p-5 text-center rounded-md">
                <p class="font-semibold">Rejected</p>
                <p id="rejectedCount" class="text-3xl font-semibold text-red-500">0</p>
            </div>
        </div>
    </header>

        <hr class="w-[85%] mx-auto my-8 border-t border-gray-300">

    <!-- available Section -->
    <section class="w-[80%] mx-auto flex justify-between my-5">
        <div class="text-3xl font-semibold text-[#002C5C]">
            <h1>Available Jobs</h1>
        </div>
        <div class="flex gap-1">
            <p id="total2" class="text-gray-600">0</p><span>Jobs</span>
        </div>
    </section>

    <!-- Main Section -->
    <main class="w-[80%] mx-auto">
    
        <div class="">
            <button onclick="toggleStyle('all-filter-btn')" class="bg-blue-500 px-5 py-2 text-white rounded-md cursor-pointer shadow-md"
                id="all-filter-btn">All</button>
            <button onclick="toggleStyle('interview-filter-btn')"
                class="bg-white px-5 py-2 text-black rounded-md cursor-pointer shadow-md"
                id="interview-filter-btn">Interview</button>
            <button onclick="toggleStyle('rejected-filter-btn')"
                class="bg-white px-5 py-2 text-black rounded-md cursor-pointer shadow-md"
                id="rejected-filter-btn">Rejected</button>
        </div>
