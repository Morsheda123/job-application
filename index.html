<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>
    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/218d7c0b86.js" crossorigin="anonymous"></script>
    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100">
    <header class="w-[80%] mx-auto">
        <h1 class="text-4xl font-bold text-[#002C5C] my-5">Job Application Tracker</h1>
    
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-white shadow-md p-5 text-center rounded-md">
                <p class="font-semibold">Total</p>
                <p id="total" class="text-3xl font-semibold text-[#002C5C]">0</p>
            </div>
    
            <div class="bg-white shadow-md p-5 text-center rounded-md">
                <p class="font-semibold">Interview</p>
                <p id="interviewCount" class="text-3xl font-semibold text-green-500">0</p>
            </div>
    
            <div class="bg-white shadow-md p-5 text-center rounded-md">
                <p class="font-semibold">Rejected</p>
                <p id="rejectedCount" class="text-3xl font-semibold text-red-500">0</p>
            </div>
        </div>
    </header>

        <hr class="w-[85%] mx-auto my-8 border-t border-gray-300">

    <!-- available Section -->
    <section class="w-[80%] mx-auto flex justify-between my-5">
        <div class="text-3xl font-semibold text-[#002C5C]">
            <h1>Available Jobs</h1>
        </div>
        <div class="flex gap-1">
            <p id="total2" class="text-gray-600">0</p><span>Jobs</span>
        </div>
    </section>

    <!-- Main Section -->
    <main class="w-[80%] mx-auto">
    
        <div class="">
            <button onclick="toggleStyle('all-filter-btn')" class="bg-blue-500 px-5 py-2 text-white rounded-md cursor-pointer shadow-md"
                id="all-filter-btn">All</button>
            <button onclick="toggleStyle('interview-filter-btn')"
                class="bg-white px-5 py-2 text-black rounded-md cursor-pointer shadow-md"
                id="interview-filter-btn">Interview</button>
            <button onclick="toggleStyle('rejected-filter-btn')"
                class="bg-white px-5 py-2 text-black rounded-md cursor-pointer shadow-md"
                id="rejected-filter-btn">Rejected</button>
        </div>

                <!-- add new object -->
        <section id="filtered-section" class="hidden mt-10 space-y-5">

        </section>

        <!-- No job  -->
        <section id="emptyState" class="hidden my-8">
            <div class="bg-white rounded-lg shadow-md p-10 flex flex-col items-center justify-center min-h-[360px] border">
                <div class="text-6xl text-blue-400 mb-4">
                    <img src="jobs.png" alt="">
                </div>
                <h2 class="text-xl font-semibold text-[#002C5C]">No jobs available</h2>
                <p class="text-gray-500 mt-2 text-sm">Check back soon for new job opportunities</p>
            </div>
        </section>

               <!-- Cards -->
        <section id="allCards" class="mt-10 space-y-5">
    
            <!-- Card 1 -->
            <div class="card  flex justify-between bg-white p-5 rounded-lg">
                <div class="space-y-6">
                    <div>
                        <p class="company text-4xl font-semibold">Microsoft</p>
                        <p class="role text-lg text-gray-700">Frontend Developer</p>
                    </div>
    
                    <div class="flex gap-5 flex-wrap">
                        <p class="location bg-gray-100 p-1 rounded-sm px-3">Remote</p>
                        <p class="time bg-gray-100 p-1 rounded-sm px-3">Full time</p>
                        <p class="salary bg-gray-100 p-1 rounded-sm px-3">$100,000 - $160,000</p>
                    </div>
    
                    <p class="status font-semibold w-fit px-2.5 py-1 bg-blue-100">Not Applied</p>
                    <p class="notes text-gray-700">Applied via career page. Need follow-up in 5 days.</p>
    
                    <div class="flex gap-4 flex-wrap">
                        <button
                            class="interview-btn bg-slate-100 font-bold px-5 py-2 text-green-500 rounded-md cursor-pointer border-2 border-green-500">Interview</button>
                        <button
                            class="rejected-btn bg-slate-100 px-5 py-2 text-red-500 font-bold rounded-md cursor-pointer border-2 border-red-500">Rejected</button>
                    </div>
                </div>
    
                <div>
                    <i class="btn-delete cursor-pointer fa-solid fa-trash-can"></i>
                </div>
            </div>
        </section>
